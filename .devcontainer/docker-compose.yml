# Services of the development container: the bot (where Visual Studio Code works) and its MongoDB database
services:
  helpbot:
    # Uses the development image of Node.js 24 (the same version as the bot image), which includes Git
    image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm

    # Keeps the container running, as the bot is started from Visual Studio Code
    command: sleep infinity

    # Loads the development variables (Discord token of the test bot, and optionally the database settings)
    env_file: .env

    # Uses its own local configuration file, which is not uploaded to Git (it is created as a copy of config.json, and its empty database settings are filled with the database of this container)
    environment:
      - CONFIG_FILE=/workspaces/HelpBot/.devcontainer/data/config.json

    volumes:
      # Mounts the repository
      - ..:/workspaces/HelpBot:cached
      # Keeps the dependencies in a Docker volume, as installing them in a folder shared with Windows is very slow
      - node_modules:/workspaces/HelpBot/node_modules

    depends_on:
      - mongodb

  mongodb:
    # Uses MongoDB 7, as the bot image
    image: mongo:7
    restart: unless-stopped

    # Before creating the database on its first start, waits for the user and password of its administrator: the ones from the .env file, or the ones of the development configuration file (as in the Docker Compose project of the docker folder)
    entrypoint:
      - sh
      - -c
      - |
        if [ -n "$$(ls -A /data/db 2>/dev/null)" ]; then exec docker-entrypoint.sh mongod; fi
        read_setting() {
          code="var p = '/helpbot-data/config.json'; var t = typeof require === 'function' ? require('fs').readFileSync(p, 'utf8') : cat(p); print((JSON.parse(t).database || {})['$$1'] || '')"
          mongosh --nodb --quiet --eval "$$code" 2>/dev/null || mongo --nodb --quiet --eval "$$code" 2>/dev/null
        }
        USERNAME="$$DB_USERNAME"; PASSWORD="$$DB_PASSWORD"; WAITED=0
        while [ -z "$$USERNAME" ] || [ -z "$$PASSWORD" ]; do
          [ -z "$$DB_USERNAME" ] && USERNAME="$$(read_setting username)"
          [ -z "$$DB_PASSWORD" ] && PASSWORD="$$(read_setting password)"
          if [ -n "$$USERNAME" ] && [ -n "$$PASSWORD" ]; then break; fi
          WAITED=$$((WAITED + 1))
          if [ "$$WAITED" -ge 120 ]; then echo "The database user and password were not found in the .env file nor in data/config.json"; exit 1; fi
          sleep 1
        done
        export MONGO_INITDB_ROOT_USERNAME="$$USERNAME" MONGO_INITDB_ROOT_PASSWORD="$$PASSWORD"
        exec docker-entrypoint.sh mongod
    environment:
      - DB_USERNAME=${DB_USERNAME:-}
      - DB_PASSWORD=${DB_PASSWORD:-}

    volumes:
      # Keeps the development data in a Docker volume, separated from any other database
      - database:/data/db
      # Reads the development configuration file
      - ./data:/helpbot-data:ro

volumes:
  node_modules:
  database:
