# Builds the Docker image and publishes it to GitHub Container Registry on every push to master or beta (or manually from the Actions tab)
name: Publish Docker image

on:
  push:
    branches: [master, beta]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# If several pushes arrive in a row on the same branch, only the latest one is built
concurrency:
  group: publish-image-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Emulates ARM so that the arm64 image can be built on x86 machines
      - uses: docker/setup-qemu-action@v4

      # Enables multi-platform builds and layer caching
      - uses: docker/setup-buildx-action@v4

      # Logs in to the registry with the token that GitHub generates on every run
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds and publishes the image with the branch tag ("latest" for master, "beta" for beta) and with the commit hash (to be able to go back to a specific version)
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Indicates the branch to the image, so that the bot links to the documentation of its version
          build-args: |
            HELPBOT_BRANCH=${{ github.ref_name }}
          tags: |
            ghcr.io/easyxploit/helpbot:${{ github.ref_name == 'master' && 'latest' || 'beta' }}
            ghcr.io/easyxploit/helpbot:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/EasyXploit/HelpBot
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}