# Construye la imagen Docker y la publica en GitHub Container Registry con cada push a master (o a mano desde la pestaña Actions)
name: Publish Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Si llegan varios pushes seguidos, solo construye el último
concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Emula ARM para poder construir la imagen arm64 en máquinas x86
      - uses: docker/setup-qemu-action@v3

      # Habilita la construcción para varias arquitecturas y la caché de capas
      - uses: docker/setup-buildx-action@v3

      # Inicia sesión en el registro con el token que GitHub genera en cada ejecución
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construye y publica la imagen con la etiqueta "latest" (la que usan los servidores) y con el hash del commit (para poder volver a una versión concreta)
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/easyxploit/helpbot:latest
            ghcr.io/easyxploit/helpbot:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/EasyXploit/HelpBot
          cache-from: type=gha
          cache-to: type=gha,mode=max